name: upload-and-download-artifacts

on: workflow_dispatch

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: checkout code
        uses: actions/checkout@v6

      - name: Create sample file
        run: |
          mkdir output
          echo "Hello from github" > output/message.txt
        
      - name: upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: output/

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-output
          path: download-files

      - name: download files
        run: |
          ls -la download-files
          cat download-files/message.txt

        
